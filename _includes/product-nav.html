<nav class="product-nav" aria-label="Product navigation">
  <div class="product-nav__items">
    <a href="{{ page.product.base | relative_url }}">Top</a>
    {% if page.product.wiki %}
    <a href="{{ page.product.base | append: 'wiki/' | relative_url }}">使い方</a>
    {% endif %}
    <a href="{{ page.product.base | append: 'changelog/' | relative_url }}">変更履歴</a>
    <a href="{{ page.product.base | append: 'privacy/' | relative_url }}">プライバシーポリシー</a>
    <a href="{{ page.product.base | append: 'terms/' | relative_url }}">利用規約</a>
    {% for store in page.product.stores %}
    <a href="{{ store.url }}" rel="noopener noreferrer">{{ store.label }}</a>
    {% endfor %}
  </div>
</nav>
