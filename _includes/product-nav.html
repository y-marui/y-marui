<nav class="product-nav" aria-label="Product navigation">
  <div class="product-nav__items">
    <a href="{{ '/' | relative_url }}">Top</a>
    <a href="{{ '/products/' | relative_url }}">Products</a>
    <a href="{{ page.product.base | relative_url }}">{{ page.product.name }}</a>
    {% if page.product.wiki %}
    <a href="{{ page.product.base | append: 'wiki/' | relative_url }}">Usage</a>
    {% endif %}
    {% unless page.product.hide_changelog %}
    <a href="{{ page.product.base | append: 'changelog/' | relative_url }}">Changelog</a>
    {% endunless %}
    <a href="{{ page.product.base | append: 'privacy/' | relative_url }}">Privacy Policy</a>
    {% unless page.product.hide_terms %}
    <a href="{{ page.product.base | append: 'terms/' | relative_url }}">Terms of Use</a>
    {% endunless %}
    {% for store in page.product.stores %}
    <a href="{{ store.url }}" rel="noopener noreferrer">{{ store.label }}</a>
    {% endfor %}
  </div>
</nav>
