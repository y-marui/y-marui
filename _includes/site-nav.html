<nav class="site-nav" aria-label="Site navigation">
  <div class="site-nav__items">
    {% for item in site.data.nav %}
      {% assign scheme = item.url | slice: 0, 4 %}
      {% if scheme == "http" %}
        <a href="{{ item.url }}" rel="noopener noreferrer">{{ item.label }}</a>
      {% else %}
        {% include nav-link.html url=item.url label=item.label %}
      {% endif %}
    {% endfor %}
  </div>
</nav>
