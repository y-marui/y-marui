name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security scan (pre-commit)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          # powershell-lint is a local-only helper; the branch guard only applies to local commits
          SKIP: powershell-lint,check-not-on-default-branch

  gate:
    name: CI
    needs: [security]
    # draft でも実行して失敗させる: skipped の必須チェックは合格扱いになるため
    # （dev-charter CI_POLICY の Draft PRs 参照）
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail on draft PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::error::draft PR: tests were not run. Mark the PR ready for review."
          exit 1
      - name: Verify required jobs succeeded
        run: |
          for result in "${{ needs.security.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed (got: $result)"
              exit 1
            fi
          done
