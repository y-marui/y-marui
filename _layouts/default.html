<!DOCTYPE html>
<!-- Adapted from Minima 2.5.1 (MIT); see docs/theme.md. -->
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body data-page-url="{{ page.url }}"{% if page.wide %} class="wide"{% endif %}>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <details class="nav-menu" open>
        <summary>Menu</summary>
        {% if page.product %}
          {% include product-nav.html %}
        {% else %}
          {% include site-nav.html %}
        {% endif %}
      </details>
    </header>
    <main class="page-content" id="main-content" tabindex="-1">
      <div class="wrapper">
        <section class="page-body" aria-label="Page content">
          {{ content }}
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <a href="https://ymarui.com/">© Yukihiro Marui</a>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.product %}
      <script src="{{ '/assets/js/contact-email.js' | relative_url }}" defer></script>
    {% endif %}
    {% if page.link_tiles %}
      <script src="{{ '/assets/js/link-tiles.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
